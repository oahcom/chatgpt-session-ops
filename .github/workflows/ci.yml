name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # Pinned Memory Adapter commit that provides src/bin/memory-stdio.rs.
  # MA main does NOT contain that file. Any MA-side implementation change the
  # SO E2E suite depends on MUST bump this SHA in the same PR that depends on it.
  MA_PINNED_SHA: caeadc5295095f72521beeaf2c1357fa99e6c11b

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # scripts/extract_auth.py imports `cdp` at module scope from an out-of-repo
      # WorkBuddy skill directory. A hardening test imports extract_auth only to
      # compare cookie-domain semantics; it never opens a connection.
      # Without this shim the import fails on Linux and the whole unit job dies.
      # ponytail: import-only stub. If a test ever needs a live CDPClient, install
      # the real browser-automation-cdp skill on the runner instead of extending it.
      - name: Provide cdp import shim
        shell: bash
        run: |
          set -euo pipefail
          SHIM="${RUNNER_TEMP}/cdpshim"
          mkdir -p "${SHIM}"
          cat > "${SHIM}/cdp.py" <<'PY'
          class CDPClient:
              def __init__(self, *args, **kwargs):
                  raise RuntimeError(
                      "CDPClient is a CI import shim; no CDP calls are expected"
                  )
          PY
          echo "CHATGPT_CDP_DIR=${SHIM}" >> "${GITHUB_ENV}"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit.log

      - name: Assert the unit run is real and did not lose tests
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys

          text = open("unit.log", encoding="utf-8", errors="replace").read()

          ran = re.search(r"^Ran (\d+) tests?", text, re.M)
          if not ran or int(ran.group(1)) == 0:
              sys.exit("unit run executed no tests; see unit.log")
          ran = int(ran.group(1))

          if not re.search(r"^OK", text, re.M):
              sys.exit("unit run did not report OK; see unit.log")

          # Expected skips are derived from the tree, not from a magic number.
          # On a base without the E2E suite the only legitimate skip is the
          # POSIX-only directory-fsync test. Once the E2E suite lands it adds
          # 5 conditional skips (1 gate test + 4 adapter tests).
          e2e_present = os.path.isfile("tests/test_memory_adapter_e2e.py")
          expected = 6 if e2e_present else 1

          found = re.search(r"skipped=(\d+)", text)
          skipped = int(found.group(1)) if found else 0
          print("ran=%d skipped=%d expected=%d e2e_present=%s"
                % (ran, skipped, expected, e2e_present))

          if skipped != expected:
              sys.exit(
                  "unit job skipped %d tests but %d are expected on this base "
                  "(e2e suite present: %s). A non-E2E test silently stopped "
                  "running, or a new skip appeared without updating this check."
                  % (skipped, expected, e2e_present)
              )
          PY

  e2e:
    name: e2e against real memory-stdio
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fail closed. The E2E suite is the only thing that proves Session Ops and
      # the Memory Adapter actually talk to each other; if the suite is missing
      # from this tree there is no integration gate, and green here would be a lie.
      - name: Require the E2E suite to exist on this tree
        shell: bash
        run: |
          if [ ! -f tests/test_memory_adapter_e2e.py ]; then
            echo "::error::E2E test file absent on this base — the e2e gate activates only once PR #5 lands"
            echo "tests/test_memory_adapter_e2e.py is introduced by"
            echo "oahcom/chatgpt-session-ops PR #5 (feat/workitem-memory-client)."
            echo "Until it is on this branch, cross-repo integration is UNVERIFIED."
            exit 1
          fi

      - name: Require MA_CHECKOUT_TOKEN
        shell: bash
        env:
          MA_TOKEN: ${{ secrets.MA_CHECKOUT_TOKEN }}
        run: |
          if [ -z "${MA_TOKEN}" ]; then
            echo "::error::MA_CHECKOUT_TOKEN is empty, so the e2e job cannot run."
            echo "Configure a fine-grained PAT with read-only 'Contents' access to"
            echo "oahcom/ai-memory-adapter at:"
            echo "  Repository Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name it MA_CHECKOUT_TOKEN. This job must never be skipped."
            exit 1
          fi

      - name: Clone Memory Adapter at pinned SHA
        shell: bash
        env:
          MA_TOKEN: ${{ secrets.MA_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          git clone --no-checkout \
            "https://x-access-token:${MA_TOKEN}@github.com/oahcom/ai-memory-adapter.git" ma
          git -C ma checkout --detach "${MA_PINNED_SHA}"
          echo "MA HEAD: $(git -C ma rev-parse HEAD)"
          if [ ! -f ma/src/bin/memory-std<｜begin▁of▁sentence｜>电影io.rs ]; then
            echo "::error::pinned SHA ${MA_PINNED_SHA} does not contain src/bin/memory-stdio.rs"
            echo "Update MA_PINNED_SHA in .github/workflows/ci.yml to a commit that has it."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Build memory-stdio
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path ma/Cargo.toml --bin memory-stdio
          BIN="${GITHUB_WORKSPACE}/ma/target/release/memory-stdio"
          if [ ! -x "${BIN}" ]; then
            echo "::error::build finished but ${BIN} is missing or not executable"
            exit 1
          fi
          echo "${BIN}" >> "${GITHUB_PATH}"

      - name: Run E2E gate
        shell: bash
        env:
          SO_MEMORY_ADAPTER_COMMAND: '["${{ github.workspace }}/ma/target/release/memory-stdio","--db","${{ runner.temp }}/ma-e2e.sqlite3"]'
          SO_MEMORY_ADAPTER_REQUIRE_E2E: "1"
          MA_SQLITE_PATH: ${{ runner.temp }}/ma-e2e.sqlite3
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_memory_adapter_e2e.py' -v 2>&1 | tee e2e.log

          # Fail closed: a skip here means the real binary never ran.
          if grep -q "skipped=" e2e.log; then
            echo "::error::e2e job reported skips; the gate must fail instead"
            exit 1
          fi
          if ! grep -q "^OK" e2e.log; then
            echo "::error::e2e run did not report OK; see e2e.log"
            exit 1
          fi
          RAN=$(sed -n 's/^Ran \([0-9]\+\) tests\?.*/\1/p' e2e.log | tail -1)
          if [ -z "${RAN}" ] || [ "${RAN}" -lt 4 ]; then
            echo "::error::e2e run executed ${RAN:-0} tests, expected at least 4"
            exit 1
          fi
          echo "e2e ran ${RAN} tests against $(command -v memory-stdio)"
