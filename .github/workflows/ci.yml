name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # Pinned Memory Adapter commit matching MA main at the time of this update.
  # src/bin/memory-stdio.rs has existed since 2f30234 and has the same blob at
  # this revision; this SHA locks the exact MA baseline validated by the SO E2E suite.
  # Any MA-side implementation change the SO E2E suite depends on MUST bump this
  # SHA in the same PR that depends on it.
  MA_PINNED_SHA: c12c3df12623c722fdfe33e4fa26aa2846f9d06d

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # scripts/extract_auth.py imports `cdp` at module scope from an out-of-repo
      # WorkBuddy skill directory. A hardening test imports extract_auth only to
      # compare cookie-domain semantics; it never opens a connection.
      # Without this shim the import fails on Linux and the whole unit job dies.
      # ponytail: import-only stub. If a test ever needs a live CDPClient, install
      # the real browser-automation-cdp skill on the runner instead of extending it.
      - name: Provide cdp import shim
        shell: bash
        run: |
          set -euo pipefail
          SHIM="${RUNNER_TEMP}/cdpshim"
          mkdir -p "${SHIM}"
          cat > "${SHIM}/cdp.py" <<'PY'
          class CDPClient:
              def __init__(self, *args, **kwargs):
                  raise RuntimeError(
                      "CDPClient is a CI import shim; no CDP calls are expected"
                  )
          PY
          echo "CHATGPT_CDP_DIR=${SHIM}" >> "${GITHUB_ENV}"

      # A single corrupted character in a guard turns the guard into a no-op:
      # bash parses the wreckage as a command, the step fails to fail, and the
      # job reports success. That is how the memory-stdio path spent its whole
      # life mangled while the pinned-SHA existence check stayed green.
      #
      # The assertion below deliberately reads a DIFFERENT step's run block than
      # the one it lives in. An earlier version matched a string that also
      # appeared in its own source, so deleting the real guard still passed
      # (mutation-verified). Structure, not text, is what gets asserted now.
      - name: Reject corrupted workflow guard text
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(".github/workflows/ci.yml")
          raw = path.read_bytes()

          forbidden = {"\uff5c", "\u2581"}
          found = sorted(
              f"U+{ord(c):04X}" for c in forbidden if c.encode("utf-8") in raw
          )
          if found:
              sys.exit("ERROR: forbidden tokenizer residue: " + ", ".join(found))

          text = raw.decode("utf-8")
          lines = text.splitlines()

          starts = [
              i for i, line in enumerate(lines)
              if line == "      - name: Clone Memory Adapter at pinned SHA"
          ]
          if len(starts) != 1:
              sys.exit("ERROR: expected exactly one pinned checkout step")

          start = starts[0]
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("      - ")),
              len(lines),
          )
          block = lines[start:end]

          run_positions = [i for i, line in enumerate(block) if line == "        run: |"]
          if len(run_positions) != 1:
              sys.exit("ERROR: pinned checkout step must contain exactly one run block")

          script_lines = []
          for line in block[run_positions[0] + 1:]:
              if line and not line.startswith("          "):
                  break
              script_lines.append(line[10:] if line else "")
          script = "\n".join(script_lines)

          guard = re.compile(
              r"(?m)^if[ \t]+\[[ \t]+![ \t]+-f[ \t]+"
              r"ma/src/bin/memory-stdio\.rs[ \t]+\];[ \t]*then$"
          )
          if len(guard.findall(script)) != 1:
              sys.exit("ERROR: pinned checkout existence guard missing or duplicated")

          print("PASS: pinned checkout guard present and unique")
          PY

      # The RS256 verification cases need cryptography. Without it they skip,
      # and a skipped security test is indistinguishable from a passing one in
      # a green log. Install the deployment dependency set so the step that
      # decides whether a token is genuine actually executes on CI.
      - name: Install MCP deployment dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check -r requirements-mcp.txt

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit.log

      - name: Assert the unit run is real and did not lose tests
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys

          text = open("unit.log", encoding="utf-8", errors="replace").read()

          ran = re.search(r"^Ran (\d+) tests?", text, re.M)
          if not ran or int(ran.group(1)) == 0:
              sys.exit("unit run executed no tests; see unit.log")
          ran = int(ran.group(1))

          if not re.search(r"^OK", text, re.M):
              sys.exit("unit run did not report OK; see unit.log")

          # Expected skips are derived from the tree, not from a magic number.
          # On a base without the E2E suite the only legitimate skip is the
          # one POSIX-only directory-fsync test. Once the E2E suite lands it
          # adds 5 conditional skips (1 gate test + 4 adapter tests).
          #
          # This job installs requirements-mcp.txt above, so both the RS256
          # suite and the real-SDK integration suite must execute here. If
          # either dependency silently fails to install, its tests skip and
          # this count moves. That is the whole assertion: a skipped security
          # or compatibility test reads as green in a log, a wrong number does
          # not. The reasons are printed so the failure names the culprit.
          #
          # The number used to be the literals 6 / 1. Those are wrong the
          # moment a legitimate platform skip is added, and it fails as
          # "skipped 7 but 6 expected", which reads like a lost test rather
          # than a new one. The platform skips are counted from the decorators
          # themselves; the runner is Linux, so the Windows-only cases are the
          # ones that skip and the POSIX-only case is the one that runs.
          e2e_present = os.path.isfile("tests/test_memory_adapter_e2e.py")

          platform_skips = 0
          for name in sorted(os.listdir("tests")):
              if not name.endswith(".py"):
                  continue
              body = open(os.path.join("tests", name),
                          encoding="utf-8", errors="replace").read()
              platform_skips += len(re.findall(
                  r'@unittest\.skipIf\(os\.name != "nt"'
                  r'|@unittest\.skipUnless\(os\.name == "nt"', body))

          expected = platform_skips + (5 if e2e_present else 0)

          found = re.search(r"skipped=(\d+)", text)
          skipped = int(found.group(1)) if found else 0
          print("ran=%d skipped=%d expected=%d e2e_present=%s platform_skips=%d"
                % (ran, skipped, expected, e2e_present, platform_skips))

          if skipped != expected:
              reasons = sorted(
                  set(re.findall(r"skipped '([^']+)'", text))
              )
              sys.exit(
                  "unit job skipped %d tests but %d are expected on this base "
                  "(e2e suite present: %s). Reasons seen: %r. A dependency "
                  "install failed and its tests skipped to green, or a new "
                  "skip appeared without updating this check."
                  % (skipped, expected, e2e_present, reasons)
              )
          PY

      # tools/tests/ guards tools/verify_deploy.py, the thing that decides
      # whether a deployed tree matches a commit. It passed but nothing ran it,
      # so it could not fail CI. Three ways to invoke it, measured on this tree:
      #
      #   pytest tools/tests -q          -> 58 passed, but pytest is not in
      #                                     requirements-mcp.txt, so the unit job
      #                                     would need a new dependency for this.
      #   unittest discover -s tools/tests -t .  -> ImportError "Start directory
      #                                     is not importable", because tools/tests
      #                                     has no __init__.py and -t . makes it
      #                                     a package.
      #   unittest discover -s tools/tests       -> 58 tests, OK. This is the
      #                                     one used below.
      #
      # Why the third works and matters: discovery adds tools/tests itself to
      # sys.path and imports the files as top-level modules, so the tests' own
      # `from tools import gen_manifest` resolves only because `-m unittest`
      # puts the working directory -- the repo root -- on sys.path. Running
      # this from anywhere else imports 3 tests that all error. The step runs
      # from the checkout root, which is that working directory.
      #
      # And the trap that produced a false result in this project before:
      # loadTestsFromName("tools.tests") returns 0 tests without raising, so
      # the assertion below refuses to trust the count alone.
      - name: Run deployment tool tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tools/tests -v 2>&1 | tee tools-tests.log

      # Same hazard as the unit run: a zero-test run and a real run both print
      # a summary, and only one of them means anything. The expected count is
      # derived from the tree by counting test methods, not pinned to a literal,
      # so adding a test does not require editing this file.
      - name: Assert the tool run is real and did not lose tests
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys

          text = open("tools-tests.log", encoding="utf-8", errors="replace").read()

          ran = re.search(r"^Ran (\d+) tests?", text, re.M)
          if not ran or int(ran.group(1)) == 0:
              sys.exit("tool run executed no tests; see tools-tests.log")
          ran = int(ran.group(1))

          if not re.search(r"^OK", text, re.M):
              sys.exit("tool run did not report OK; see tools-tests.log")

          expected = 0
          for name in sorted(os.listdir("tools/tests")):
              if not name.endswith(".py"):
                  continue
              body = open(os.path.join("tools/tests", name),
                          encoding="utf-8", errors="replace").read()
              expected += len(re.findall(r"(?m)^    def test_", body))

          print("ran=%d expected=%d" % (ran, expected))

          if ran != expected:
              sys.exit(
                  "tool run executed %d tests but %d test methods exist in "
                  "tools/tests; a file failed to import and its tests were "
                  "silently dropped, or discovery matched the wrong directory."
                  % (ran, expected)
              )
          PY

  # The unit job proves the core package imports without the optional SDK.
  # This job proves the opposite direction: that the deployment surface we
  # actually ship is compatible with the SDK version we actually pin. Until
  # this existed, build_mcp_server's assumptions about mcp==2.3.0 were checked
  # by hand once and never again -- a renamed keyword or a changed context type
  # would have shipped green and broken on the first real deployment.
  sdk:
    name: real MCP SDK integration
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned MCP SDK
        run: |
          python -m pip install --disable-pip-version-check -r requirements-mcp.txt pytest

      - name: Run real MCP SDK integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_mcp_sdk_integration.py -v 2>&1 | tee sdk.log

      # Same hazard as the RS256 skip: a skipped test reads as green. The SDK is
      # installed above, so anything other than four executed cases means the
      # dependency did not land or the import path moved underneath us.
      - name: Require the SDK tests to execute
        shell: bash
        run: |
          python - <<'PY'
          import re
          import sys

          lines = [
              line.strip()
              for line in open("sdk.log", encoding="utf-8", errors="replace")
              if line.strip()
          ]
          summary = lines[-1] if lines else ""

          # pytest pads the summary with '=' on both sides, so the counts are
          # neither at line start nor preceded by a comma. Anchoring on
          # (?:^|,\s*) parsed "==== 4 passed ====" as zero passed and failed a
          # good run; this version was checked against five real summary shapes.
          def count(label):
              match = re.search(r"(\d+)\s+" + label, summary)
              return int(match.group(1)) if match else 0

          passed = count("passed")
          skipped = count("skipped")
          failed = count("failed")
          errors = count("error")
          print("sdk integration: passed=%d skipped=%d failed=%d errors=%d"
                % (passed, skipped, failed, errors))

          if skipped:
              sys.exit(
                  "SDK is installed but the integration tests were skipped; "
                  "dependency install or import path is broken"
              )
          if failed or errors:
              sys.exit("SDK integration tests failed; see sdk.log")
          if passed < 4:
              sys.exit(
                  "expected at least 4 SDK integration cases, %d ran" % passed
              )
          print("PASS: the pinned SDK was exercised, not skipped")
          PY

  e2e:
    name: e2e against real memory-stdio
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fail closed. The E2E suite is the only thing that proves Session Ops and
      # the Memory Adapter actually talk to each other; if the suite is missing
      # from this tree there is no integration gate, and green here would be a lie.
      - name: Require the E2E suite to exist on this tree
        shell: bash
        run: |
          if [ ! -f tests/test_memory_adapter_e2e.py ]; then
            echo "::error::E2E test file absent on this base — the e2e gate activates only once PR #5 lands"
            echo "tests/test_memory_adapter_e2e.py is introduced by"
            echo "oahcom/chatgpt-session-ops PR #5 (feat/workitem-memory-client)."
            echo "Until it is on this branch, cross-repo integration is UNVERIFIED."
            exit 1
          fi

      - name: Require MA_CHECKOUT_TOKEN
        shell: bash
        env:
          MA_TOKEN: ${{ secrets.MA_CHECKOUT_TOKEN }}
        run: |
          if [ -z "${MA_TOKEN}" ]; then
            echo "::error::MA_CHECKOUT_TOKEN is empty, so the e2e job cannot run."
            echo "Configure a fine-grained PAT with read-only 'Contents' access to"
            echo "oahcom/ai-memory-adapter at:"
            echo "  Repository Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name it MA_CHECKOUT_TOKEN. This job must never be skipped."
            exit 1
          fi

      - name: Clone Memory Adapter at pinned SHA
        shell: bash
        env:
          MA_TOKEN: ${{ secrets.MA_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          git clone --no-checkout \
            "https://x-access-token:${MA_TOKEN}@github.com/oahcom/ai-memory-adapter.git" ma
          git -C ma checkout --detach "${MA_PINNED_SHA}"
          echo "MA HEAD: $(git -C ma rev-parse HEAD)"
          if [ ! -f ma/src/bin/memory-stdio.rs ]; then
            echo "::error::pinned SHA ${MA_PINNED_SHA} does not contain src/bin/memory-stdio.rs"
            echo "Update MA_PINNED_SHA in .github/workflows/ci.yml to a commit that has it."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Build memory-stdio
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path ma/Cargo.toml --bin memory-stdio
          BIN="${GITHUB_WORKSPACE}/ma/target/release/memory-stdio"
          if [ ! -x "${BIN}" ]; then
            echo "::error::build finished but ${BIN} is missing or not executable"
            exit 1
          fi
          echo "${BIN}" >> "${GITHUB_PATH}"

      - name: Run E2E gate
        shell: bash
        env:
          SO_MEMORY_ADAPTER_COMMAND: '["${{ github.workspace }}/ma/target/release/memory-stdio","--db","${{ runner.temp }}/ma-e2e.sqlite3"]'
          SO_MEMORY_ADAPTER_REQUIRE_E2E: "1"
          MA_SQLITE_PATH: ${{ runner.temp }}/ma-e2e.sqlite3
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_memory_adapter_e2e.py' -v 2>&1 | tee e2e.log

          # Fail closed: a skip here means the real binary never ran.
          if grep -q "skipped=" e2e.log; then
            echo "::error::e2e job reported skips; the gate must fail instead"
            exit 1
          fi
          if ! grep -q "^OK" e2e.log; then
            echo "::error::e2e run did not report OK; see e2e.log"
            exit 1
          fi
          RAN=$(sed -n 's/^Ran \([0-9]\+\) tests\?.*/\1/p' e2e.log | tail -1)
          if [ -z "${RAN}" ] || [ "${RAN}" -lt 4 ]; then
            echo "::error::e2e run executed ${RAN:-0} tests, expected at least 4"
            exit 1
          fi
          echo "e2e ran ${RAN} tests against $(command -v memory-stdio)"
