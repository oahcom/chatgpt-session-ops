# Session Ops MCP
# Include inside the existing TLS server block for
# mcp.oachom0831.xyz.
#
# Do NOT add WWW-Authenticate here.
# Authentication challenges are generated by the SO MCP ASGI app.

location = /so-mcp {
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8791;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Authorization $http_authorization;

    proxy_buffering off;
    proxy_request_buffering on;

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 12s;
}

location ^~ /so-mcp/ {
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8791;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Authorization $http_authorization;

    proxy_buffering off;
    proxy_request_buffering on;

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 12s;
}

# IMPORTANT:
# This exact location must take precedence over the existing
# ^~ /.well-known/oauth-protected-resource/ location.

location = /.well-known/oauth-protected-resource/so-mcp {
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8791;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 12s;
}
